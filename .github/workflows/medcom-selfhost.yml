name: Medcom self-hosted frontend
on:
  push:
    branches: [main, 'codex/g45-selfhost-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medcom-selfhost-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SOURCE_REVISION: ${{ github.sha }}
      PACKAGE_DIRECTORY: artifacts/medcom-frontend-${{ matrix.platform }}-x64
      MEDCOM_BROWSER_TOOLCHAIN: ${{ github.workspace }}/src/frontend
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Record checkout and runtime
        run: |
          git rev-parse HEAD
          node --version
          pnpm --version
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Install locked frontend dependencies
        working-directory: apps/medcom-sites
        run: pnpm install --frozen-lockfile
      - name: Install locked synthetic browser test toolchain
        working-directory: src/frontend
        run: npm ci --ignore-scripts
      - name: Require installed synthetic test browser
        run: |
          node --input-type=module <<'NODE'
          import {accessSync, appendFileSync, constants} from 'node:fs';
          import {createRequire} from 'node:module';
          import {join, resolve} from 'node:path';
          if (process.versions.node.split('.')[0] !== '24') throw new Error('I12 browser tests require Node24');
          try {
            createRequire(join(resolve(process.env.MEDCOM_BROWSER_TOOLCHAIN), 'package.json')).resolve('playwright-core');
          } catch {
            throw new Error('Required locked I12 playwright-core toolchain is unavailable');
          }
          const candidates = process.platform === 'win32' ? [
            'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe',
            'C:/Program Files/Microsoft/Edge/Application/msedge.exe',
          ] : process.platform === 'linux' ? [
            '/usr/bin/google-chrome', '/usr/bin/google-chrome-stable',
            '/opt/google/chrome/chrome', '/usr/bin/chromium', '/usr/bin/chromium-browser',
          ] : [];
          const browser = candidates.find(candidate => {
            try {accessSync(candidate, constants.X_OK); return true;} catch {return false;}
          });
          if (!browser) throw new Error(`Required installed I12 browser unavailable on ${process.platform}; checked ${candidates.join(', ')}`);
          appendFileSync(process.env.GITHUB_ENV, `MEDCOM_EDGE_PATH=${browser}\n`);
          console.log(`Synthetic I12 browser: ${browser}; Node ${process.versions.node}`);
          NODE
      - name: Typecheck
        working-directory: apps/medcom-sites
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/medcom-sites
        run: pnpm lint
      - name: Test ERP proxy and application contracts
        working-directory: apps/medcom-sites
        run: node scripts/test-erp.mjs
      - name: Test inbound editor with synthetic mobile browser
        working-directory: apps/medcom-sites
        env:
          I18_TEST_BROWSER: ${{ env.MEDCOM_EDGE_PATH }}
        run: node --test --test-reporter=tap tests/mobile-inbound-request.test.mjs
      - name: Upload synthetic inbound editor evidence
        uses: actions/upload-artifact@v4
        with:
          name: medcom-inbound-editor-evidence-${{ matrix.platform }}-x64-${{ github.sha }}
          path: |
            apps/medcom-sites/.test-runtime/i18-mobile-inbound/browser-result.json
            apps/medcom-sites/.test-runtime/i18-mobile-inbound/synthetic-mobile-inbound.png
          if-no-files-found: error
      - name: Require inbound host HTTP and mobile tests
        working-directory: apps/medcom-sites
        env:
          I21_TEST_BROWSER: ${{ env.MEDCOM_EDGE_PATH }}
          I21_REACT_REQUIRED: '1'
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {readFileSync, rmSync} from 'node:fs';
          const evidencePath='.test-runtime/i21-inbound/react-result.json';
          rmSync(evidencePath,{force:true});
          const result=spawnSync(process.execPath,['--test','--test-reporter=tap','tests/inbound-request-integration.test.mjs'],{encoding:'utf8',maxBuffer:32*1024*1024});
          process.stdout.write(result.stdout??''); process.stderr.write(result.stderr??'');
          if(result.error)throw result.error;
          if(result.status!==0)process.exit(result.status??1);
          if(/#\s*SKIP\b/i.test((result.stdout??'')+(result.stderr??'')))throw new Error('Required I21 tests may not skip');
          const evidence=JSON.parse(readFileSync(evidencePath,'utf8'));
          if(!Array.isArray(evidence.results)||evidence.results.length===0||evidence.results.some(item=>item.result!=='PASS')
            ||!Array.isArray(evidence.errors)||evidence.errors.length!==0||!Array.isArray(evidence.external)||evidence.external.length!==0
            ||typeof evidence.browser!=='string'||!evidence.browser)throw new Error('Required I21 React evidence incomplete');
          console.log(`Verified ${evidence.results.length} synthetic I21 React scenarios; no skipped test gate`);
          NODE
      - name: Upload synthetic inbound host evidence
        uses: actions/upload-artifact@v4
        with:
          name: medcom-inbound-host-evidence-${{ matrix.platform }}-x64-${{ github.sha }}
          path: |
            apps/medcom-sites/.test-runtime/i21-inbound/react-result.json
            apps/medcom-sites/.test-runtime/i21-inbound/host-320.png
            apps/medcom-sites/.test-runtime/i21-inbound/host-360.png
            apps/medcom-sites/.test-runtime/i21-inbound/host-390.png
          if-no-files-found: error
      - name: Test QR scanner with synthetic camera in installed browser
        working-directory: apps/medcom-sites
        env:
          QR_TEST_BROWSER: ${{ env.MEDCOM_EDGE_PATH }}
        run: node tests/qr-scanner.browser.mjs
      - name: Test standalone package guards
        working-directory: apps/medcom-sites
        run: node --test tests/standalone-package.test.mjs
      - name: Build standalone frontend
        working-directory: apps/medcom-sites
        run: pnpm build
      - name: Package public standalone output
        working-directory: apps/medcom-sites
        run: node scripts/package-standalone.mjs
      - name: Verify exact-revision package
        run: node apps/medcom-sites/scripts/verify-standalone.mjs "$PACKAGE_DIRECTORY" "$SOURCE_REVISION"
      - name: Smoke test packaged process without private dependencies
        run: node apps/medcom-sites/scripts/smoke-standalone.mjs "$PACKAGE_DIRECTORY" "$SOURCE_REVISION"
      - name: Build locked local HTTPS relay and synthetic fixture
        run: |
          dotnet restore tests/backend/Medcom.LocalFrontendFixture/Medcom.LocalFrontendFixture.csproj --locked-mode
          dotnet publish tests/backend/Medcom.LocalFrontendFixture/Medcom.LocalFrontendFixture.csproj -c Release --no-restore -o artifacts/i28-synthetic-fixture
          dotnet publish tools/local-frontend/Medcom.LocalFrontendHost/Medcom.LocalFrontendHost.csproj -c Release --no-restore -o artifacts/medcom-local-frontend-host
      - name: Test built modern Workspace through actual HTTPS relay and BFF
        working-directory: apps/medcom-sites
        env:
          I28_PACKAGE_DIRECTORY: ${{ github.workspace }}/${{ env.PACKAGE_DIRECTORY }}
          I28_FIXTURE_DLL: ${{ github.workspace }}/artifacts/i28-synthetic-fixture/Medcom.LocalFrontendFixture.dll
        run: node --test --test-reporter=tap tests/local-https-frontend.test.mjs
      - name: Upload synthetic local HTTPS evidence
        uses: actions/upload-artifact@v4
        with:
          name: medcom-local-https-evidence-${{ matrix.platform }}-x64-${{ github.sha }}
          path: |
            apps/medcom-sites/.test-runtime/i28-local-https/result.json
            apps/medcom-sites/.test-runtime/i28-local-https/workspace-320.png
            apps/medcom-sites/.test-runtime/i28-local-https/workspace-390.png
          if-no-files-found: error
      - name: Package local HTTPS host with exact source hashes
        env:
          I28_PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path('artifacts/medcom-local-frontend-host')
          for p in root.rglob('*.pdb'): p.unlink()
          shutil.copyfile('tools/deploy/Start-MedcomLocalFrontend.ps1',root/'Start-MedcomLocalFrontend.ps1')
          files=[];directories=[]
          for p in sorted(root.rglob('*')):
              if p.is_symlink(): raise RuntimeError('No linked helper members')
              relative=p.relative_to(root).as_posix()
              if p.is_dir(): directories.append(relative)
              elif p.is_file():
                  data=p.read_bytes();files.append({'path':relative,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              else: raise RuntimeError('Unexpected helper member')
          manifest={'schemaVersion':1,'artifact':'medcom-local-frontend-host','sourceRevision':os.environ['SOURCE_REVISION'],
              'platform':os.environ['I28_PACKAGE_PLATFORM'],'arch':'x64','entryPoint':'Medcom.LocalFrontendHost.dll',
              'admission':'BLOCKED_BUSINESS_AND_RUNTIME_ACCEPTANCE','files':files,'directories':directories}
          (root/'medcom-local-frontend-package.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(f'Prepared {len(files)} exact-hash helper members; no fixture/certificate/Node runtime included')
          PY
      - name: Verify Windows launcher parsing, manifests and occupied-port rejection
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $launcher=Join-Path $PWD 'tools/deploy/Start-MedcomLocalFrontend.ps1'
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($launcher,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'Windows PowerShell launcher parsing failed.' }
          foreach ($fn in $ast.FindAll({param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst]},$false)) {
            . ([scriptblock]::Create($fn.Extent.Text))
          }
          $ExpectedRevision=$env:SOURCE_REVISION
          $frontend=[IO.Path]::GetFullPath($env:PACKAGE_DIRECTORY)
          $hostRoot=Join-Path $PWD 'artifacts/medcom-local-frontend-host'
          Verify-Artifact $frontend 'medcom-package.json' 'medcom-frontend'
          Verify-Artifact $hostRoot 'medcom-local-frontend-package.json' 'medcom-local-frontend-host'
          $ExpectedRevision='0000000000000000000000000000000000000000'
          $rejected=$false
          try { Verify-Artifact $frontend 'medcom-package.json' 'medcom-frontend' } catch { $rejected=$true }
          if (-not $rejected) { throw 'Launcher accepted the wrong artifact revision.' }
          $listener=New-Object Net.Sockets.TcpListener([Net.IPAddress]::Loopback,0)
          try {
            $listener.Start();$rejected=$false
            try { Check-Port $listener.LocalEndpoint.Port } catch { $rejected=$true }
            if (-not $rejected) { throw 'Launcher accepted an occupied loopback port.' }
          } finally { $listener.Stop() }
          foreach ($unsafe in @('../x','/absolute','C:/x','a\b')) {
            $rejected=$false;try { Valid-Relative $unsafe } catch { $rejected=$true }
            if (-not $rejected) { throw 'Launcher accepted an unsafe manifest path.' }
          }
          Write-Host 'Windows launcher parsing, exact artifact manifests, wrong revision, unsafe paths and occupied port: PASS'
      - name: Upload verified local HTTPS host
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: medcom-local-frontend-host-${{ matrix.platform }}-x64-${{ github.sha }}
          path: artifacts/medcom-local-frontend-host/
          if-no-files-found: error
      - name: Record exact tested source and base
        if: github.event_name == 'pull_request'
        env:
          TEST_EVENT: ${{ github.event_name }}
          TEST_SOURCE: ${{ github.event.pull_request.head.sha }}
          TEST_BASE: ${{ github.event.pull_request.base.sha }}
          TEST_RUN_ID: ${{ github.run_id }}
          TEST_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/tested_receipt.py --output "artifacts/frontend-tested-merge-${{ matrix.platform }}.json"
      - name: Upload frontend tested provenance
        uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'pull_request'
        with:
          name: medcom-frontend-tested-merge-${{ matrix.platform }}-x64
          path: artifacts/frontend-tested-merge-${{ matrix.platform }}.json
          if-no-files-found: error
      - name: Upload verified public frontend candidate
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: medcom-frontend-${{ matrix.platform }}-x64-${{ github.sha }}
          path: ${{ env.PACKAGE_DIRECTORY }}/
          # Next needs .next files. The package's restrictive guards run first;
          # never upload the checkout, private configuration or raw ERP sources.
          include-hidden-files: true
          if-no-files-found: error
