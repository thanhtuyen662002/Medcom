name: Railway container validation
on:
  push:
    branches: [main, 'medcom-work/**', 'medcom-ci/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  railway-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned policy parser
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Validate source-only container contracts
        run: python -m unittest discover -s tests/deploy -p 'test_*.py' -v
      - name: Build root-context API and isolated worker image
        run: docker build --pull --tag medcom-railway:test .
      - name: Check actual context and network-isolated foundation runtime
        env:
          MEDCOM_CONTAINER_IMAGE: medcom-railway:test
        run: python -m unittest discover -s tests/deploy -p 'test_*.py' -v
