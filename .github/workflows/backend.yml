name: Backend foundation
on:
  push:
    branches: [main, medcom-schedule-activation-20261002]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Verify project boundaries
        run: python tools/backend/check_architecture.py
      - name: Restore
        run: dotnet restore Medcom.slnx --locked-mode
      - name: Build with analyzers
        run: dotnet build Medcom.slnx --configuration Release --no-restore
      - name: Test actual HTTP boundary
        run: dotnet test Medcom.slnx --configuration Release --no-build --filter 'Category!=LegacyRuntime' --logger 'trx;LogFileName=backend.trx'
      - name: Verify prepared reference models
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/backend/run_preparation_checks.py
      - name: Verify finite source metadata and scanner regressions
        run: python tools/source/validate_catalog.py && python -m unittest discover -s tools/source -p 'test_*.py'
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Verify frontend contracts and types
        working-directory: src/frontend
        run: npm test && npm run typecheck
      - name: Build frontend
        working-directory: src/frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Package API and frontend
        run: python tools/deploy/package.py
      - name: Install browser for end-to-end checks
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium
      - name: Test packaged HTTPS app in browser
        working-directory: src/frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: medcom-server-candidate
          path: artifacts/medcom-server-candidate.zip
          if-no-files-found: error
