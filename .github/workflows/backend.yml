name: Backend foundation
on:
  push:
    branches: [main, medcom-schedule-activation-20261002]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify project boundaries
        run: python tools/backend/check_architecture.py
      - name: Restore
        run: dotnet restore Medcom.slnx --locked-mode
      - name: Build with analyzers
        run: dotnet build Medcom.slnx --configuration Release --no-restore
      - name: Test actual HTTP boundary
        run: dotnet test Medcom.slnx --configuration Release --no-build --logger 'trx;LogFileName=backend.trx'
      - name: Verify prepared reference models
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/backend/run_preparation_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
